# =========================================
# LifeAdmin Backend Configuration
# =========================================

# Server
server.port=8096

# Application name
spring.application.name=lifeadmin-backend

# =========================================
# MySQL Datasource
# =========================================
# Make sure MySQL is running locally and that you have created the
# "lifeadmin" database using database/lifeadmin.sql before starting the app.
spring.datasource.url=jdbc:mysql://localhost:3306/lifeadmin?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=chinmayi11
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================================
# JWT Configuration
# =========================================
# 256-bit (32+ char) secret used to sign JWT tokens. Change this in production.
app.jwt.secret=ThisIsALifeAdminSuperSecretKeyThatIsAtLeast256BitsLong123456
# Token validity in milliseconds (24 hours)
app.jwt.expiration-ms=86400000

# =========================================
# Logging
# =========================================
logging.level.org.springframework.security=INFO
logging.level.com.lifeadmin=DEBUG
